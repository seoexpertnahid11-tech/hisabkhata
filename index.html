<style>
/* Layout: liquid-glass ledger — frosted panels floating over a soft teal→blue→violet light field; sidebar on desktop, floating glass tab bar on phone */
:root{
  --bg:#f3f7ff; --ink:#071433; --muted:#53627f;
  --glass:rgba(255,255,255,.68); --glass-strong:rgba(255,255,255,.92); --glass-line:rgba(255,255,255,.95); --hi:#ffffff;
  --surface:var(--glass); --sunk:rgba(222,233,255,.55); --line:rgba(10,40,120,.09);
  --accent:#0057ff; --accent-2:#1e9bff; --accent-soft:rgba(0,87,255,.10); --on-accent:#ffffff;
  --good:#0b9a5a; --good-soft:rgba(11,154,90,.12); --bad:#e5303c; --bad-soft:rgba(229,48,60,.10); --warn:#b86a00; --warn-soft:rgba(255,170,40,.16);
  --opt-bg:#ffffff; --opt-ink:#071433; --blob1:#b9d3ff; --blob2:#5f99ff; --blob3:#d6e6ff; --blob4:#8fd8ff;
  --shadow:0 10px 32px rgba(0,50,170,.10),0 1px 2px rgba(0,50,170,.06);
  --f-display:"Anek Bangla","Hind Siliguri",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Anek Bangla",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#030919; --ink:#eef4ff; --muted:#93a3c4;
  --glass:rgba(12,24,58,.58); --glass-strong:rgba(16,30,72,.92); --glass-line:rgba(110,160,255,.18); --hi:rgba(255,255,255,.12);
  --sunk:rgba(70,120,255,.08); --line:rgba(140,180,255,.11);
  --accent:#4d8dff; --accent-2:#2fc4ff; --accent-soft:rgba(77,141,255,.16); --on-accent:#030919;
  --good:#3ddc97; --good-soft:rgba(61,220,151,.14); --bad:#ff6b72; --bad-soft:rgba(255,107,114,.14); --warn:#ffb547; --warn-soft:rgba(255,181,71,.14);
  --opt-bg:#0e1b42; --opt-ink:#eef4ff; --blob1:#0a2f8a; --blob2:#0049d6; --blob3:#071c52; --blob4:#00609e;
  --shadow:0 10px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#030919; --ink:#eef4ff; --muted:#93a3c4;
  --glass:rgba(12,24,58,.58); --glass-strong:rgba(16,30,72,.92); --glass-line:rgba(110,160,255,.18); --hi:rgba(255,255,255,.12);
  --sunk:rgba(70,120,255,.08); --line:rgba(140,180,255,.11);
  --accent:#4d8dff; --accent-2:#2fc4ff; --accent-soft:rgba(77,141,255,.16); --on-accent:#030919;
  --good:#3ddc97; --good-soft:rgba(61,220,151,.14); --bad:#ff6b72; --bad-soft:rgba(255,107,114,.14); --warn:#ffb547; --warn-soft:rgba(255,181,71,.14);
  --opt-bg:#0e1b42; --opt-ink:#eef4ff; --blob1:#0a2f8a; --blob2:#0049d6; --blob3:#071c52; --blob4:#00609e;
  --shadow:0 10px 32px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bgfx i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:var(--blob1)}
.bgfx i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:-10vmax;background:var(--blob2)}
.bgfx i:nth-child(3){width:45vmax;height:45vmax;right:-8vmax;bottom:-22vmax;background:var(--blob3)}
.bgfx i:nth-child(4){width:35vmax;height:35vmax;left:-6vmax;bottom:-14vmax;background:var(--blob4);opacity:.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.glass,.card,.side,.bottom,.qa,.tabs,.sheet,.search,select.sel,.btn:not(.primary):not(.gave):not(.got):not(.ghost){
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;margin:16px 0 16px 16px;height:calc(100vh - 32px);padding:20px 12px;border-radius:24px}
  .bottom{display:none!important}
  main{padding-block:32px 48px}
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 12px rgba(0,87,255,.35))}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;display:block;line-height:1.05;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.nav-a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.nav-a:hover{background:var(--sunk);color:var(--ink)}
.nav-a.on{background:var(--glass-strong);color:var(--accent);box-shadow:inset 0 1px 0 var(--hi),0 2px 10px rgba(0,87,255,.14)}
.nav-a svg{width:21px;height:21px;flex:none}
.bottom{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:repeat(6,1fr);padding:6px;border-radius:26px}
.bottom .nav-a{flex-direction:column;gap:1px;padding:7px 1px;font-size:11px;white-space:nowrap;justify-content:center;border-radius:20px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:700}
.m-brand{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-brand .logo{width:28px;height:28px}
@media (min-width:900px){.m-brand{display:none}}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
.card{border-radius:22px}
.pad{padding:18px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding:0 4px}
.sec-h h2{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero balance */
.summary{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative}
.summary::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,87,255,.06),rgba(30,155,255,.08));pointer-events:none}
.sum-cell{padding:18px 20px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.sum-cell + .sum-cell{border-left:1px solid var(--line)}
.sum-cell .lab{font-size:13px;color:var(--muted)}
.sum-cell .val{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;overflow-wrap:anywhere;letter-spacing:-.01em}
.sum-foot{grid-column:1/-1;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;padding:11px 20px;background:var(--sunk);font-size:14px;position:relative}
.good{color:var(--good)} .bad{color:var(--bad)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.quick{grid-template-columns:repeat(2,1fr)}}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:20px;cursor:pointer;text-align:left;font-weight:600;transition:transform .15s}
.qa:hover{transform:translateY(-2px)}
.qa:active{transform:scale(.98)}
.qa i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.qa .i-good{background:linear-gradient(135deg,#1e9bff,#0057ff)}
.qa .i-bad{background:linear-gradient(135deg,#1e9bff,#0057ff)}
.qa .i-acc{background:linear-gradient(135deg,#1e9bff,#0057ff)}
.qa .i-warn{background:linear-gradient(135deg,#1e9bff,#0057ff)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px}

.rows{display:flex;flex-direction:column;overflow:hidden}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-width:0;transition:background .15s}
.row:first-child{border-top:0}
a.row:hover,button.row:hover{background:var(--sunk)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,#2a8bff,#0047e6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.av.sup{background:linear-gradient(135deg,#5fd3ff,#0a84d6)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;font-weight:700;white-space:nowrap}
.row .amt small{display:block;font-size:12px;font-weight:500}
.row > div{min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-good{background:var(--good-soft);color:var(--good)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:14px;border:1px solid transparent;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,87,255,.32)}
.btn.gave{background:linear-gradient(135deg,#ff7a7f,#e0353f);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(224,53,63,.28)}
.btn.got{background:linear-gradient(135deg,#2fd6a0,#0f9d58);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(15,157,88,.28)}
.btn.primary:hover,.btn.gave:hover,.btn.got:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.split > .btn{flex:1;padding:13px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:16px}
.tabs button{flex:1;border:0;background:none;padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--muted);transition:all .2s}
.tabs button.on{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(20,40,90,.12)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;padding:11px 16px;border-radius:14px}
select.sel{padding:11px 12px;border-radius:14px}

.ph{display:flex;gap:14px;align-items:center}
.ph .av{width:56px;height:56px;font-size:24px;border-radius:18px}
.bigbal{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.tbl-wrap{overflow-x:auto}
table.led{width:100%;border-collapse:collapse;font-size:14px}
table.led th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
table.led th:first-child,table.led td:first-child{text-align:left}
table.led td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
table.led td:first-child{white-space:normal;min-width:120px}
table.led td .pill{margin-top:3px}
table.led tr:last-child td{border-bottom:0}
.col-gave{color:var(--bad);font-weight:600} .col-got{color:var(--good);font-weight:600}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:3px 8px;border-radius:8px;font-size:12px}
.xbtn:hover{color:var(--bad);background:var(--bad-soft)}
.xbtn.armed{color:#fff;background:var(--bad)}
.tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 6px;margin-left:5px}

.daynav{display:flex;align-items:center;gap:8px}
.daynav b{min-width:110px;text-align:center;font-family:var(--f-display);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:15px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.stat .lab{font-size:13px;color:var(--muted)}
.stat .val{font-family:var(--f-display);font-size:23px;font-weight:700;overflow-wrap:anywhere}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

function rangeStart(){const t=today();if(rr==='today')return t;if(rr==='week')return addDays(t,-6);if(rr==='month')return t.slice(0,8)+'01';return'0000'}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function chart(start){
  const t=today();let n=rr==='month'?Math.max(7,Math.round((new Date(t)-new Date(start))/864e5)+1):rr==='all'?30:7;
  const days=Array.from({length:n},(_,i)=>addDays(t,i-n+1));
  const data=days.map(d=>({d,s:S.cash.filter(c=>c.date===d&&c.type==='sale').reduce((a,c)=>a+c.amount,0),e:S.cash.filter(c=>c.date===d&&c.type==='expense').reduce((a,c)=>a+c.amount,0)+S.spay.filter(p=>isOut(p)&&p.date===d).reduce((a,p)=>a+p.amount,0)}));
  const mx=niceMax(Math.max(...data.flatMap(x=>[x.s,x.e])));
  const W=640,H=230,L=58,R=8,T=12,B=28,cw=(W-L-R)/n,bw=Math.max(2,Math.min(14,cw*.34)),y=v=>T+(H-T-B)*(1-v/mx);
  let g='';
  [0,.5,1].forEach(f=>{const v=mx*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${f?'stroke-dasharray="3 4"':''}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${bn(Math.round(v).toLocaleString('en-IN'))}</text>`});
  const step=Math.ceil(n/8);
  data.forEach((x,i)=>{const cx=L+cw*i+cw/2;
    if(x.s)g+=`<rect x="${cx-bw-1}" y="${y(x.s)}" width="${bw}" height="${y(0)-y(x.s)}" rx="2" fill="var(--accent)"><title>${pdate(x.d)} বিক্রি ${money(x.s)}</title></rect>`;
    if(x.e)g+=`<rect x="${cx+1}" y="${y(x.e)}" width="${bw}" height="${y(0)-y(x.e)}" rx="2" fill="var(--bad)"><title>${pdate(x.d)} খরচ ${money(x.e)}</title></rect>`;
    if((n-1-i)%step===0)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${bn(+x.d.slice(8))}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="দৈনিক বিক্রি ও খরচ">${g}</svg>`;
}

/* ---------- 3D coin ---------- */
const RIM=Array.from({length:15},(_,i)=>`<div class="rim" style="transform:translateZ(${i-7}px)"></div>`).join('');
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const C={rx:-14,ry:-20,vx:0,vy:0,drag:false,lx:0,ly:0,sx:0,sy:0,t:0,raf:0,hov:null};
function coinLoop(){
  const el=document.getElementById('coin');if(!el){C.raf=0;return}
  C.t++;
  if(!C.drag){
    const base=RM?0:.45;
    C.ry+=C.vy+base;C.vy*=.955;
    C.rx+=C.vx;C.vx*=.9;
    const tx=C.hov?-C.hov.y*35:-14;C.rx+=(tx-C.rx)*.05;
    if(C.hov)C.ry+=C.hov.x*.8;
  }
  C.rx=Math.max(-65,Math.min(65,C.rx));
  const bob=RM?0:Math.sin(C.t/38)*5;
  el.style.transform=`translateY(${bob.toFixed(2)}px) rotateX(${C.rx.toFixed(2)}deg) rotateY(${C.ry.toFixed(2)}deg)`;
  el.style.setProperty('--gx',(50+Math.sin(C.ry*Math.PI/180)*70).toFixed(1)+'%');
  const sh=document.getElementById('coinShadow');if(sh){sh.style.transform=`translateX(-50%) scale(${(1-bob/30).toFixed(3)})`;sh.style.opacity=(.85-bob/25).toFixed(2)}
  C.raf=requestAnimationFrame(coinLoop);
}
function startCoin(){if(!C.raf&&document.getElementById('coin'))C.raf=requestAnimationFrame(coinLoop)}
function coinSpin(){C.vy=RM?0:24;if(RM)C.ry+=180;const st=document.getElementById('coinStage');if(st){st.classList.remove('pop');void st.offsetWidth;st.classList.add('pop')}}
document.addEventListener('pointerdown',e=>{const st=e.target.closest('#coinStage');if(!st)return;e.preventDefault();C.drag=true;C.lx=C.sx=e.clientX;C.ly=C.sy=e.clientY;C.vx=C.vy=0;try{st.setPointerCapture(e.pointerId)}catch(x){}st.classList.add('grab')});
document.addEventListener('pointermove',e=>{
  if(C.drag){const dx=e.clientX-C.lx,dy=e.clientY-C.ly;C.ry+=dx*.8;C.rx-=dy*.8;C.vy=dx*.8;C.vx=-dy*.5;C.lx=e.clientX;C.ly=e.clientY;return}
  if(e.pointerType!=='mouse')return;
  const st=document.getElementById('coinStage');if(!st){C.hov=null;return}
  const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const x=(e.clientX-cx)/(r.width*1.6),y=(e.clientY-cy)/(r.height*1.6);
  C.hov=Math.abs(x)<1.4&&Math.abs(y)<1.4?{x:Math.max(-1,Math.min(1,x)),y:Math.max(-1,Math.min(1,y))}:null;
});
const endDrag=e=>{if(!C.drag)return;C.drag=false;const st=document.getElementById('coinStage');if(st)st.classList.remove('grab');if(e.type==='pointerup'&&Math.hypot(e.clientX-C.sx,e.clientY-C.sy)<6)coinSpin()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

    case'install-later':lsSet('hk_noinstall','1');render();break;
    case'change-pw':{const g=id=>document.getElementById(id).value,m=document.getElementById('pwmsg');
      el.disabled=true;changePw(g('cp-old'),g('cp-new'),g('cp-new2')).then(()=>{m.className='small good';m.textContent='পাসওয়ার্ড বদলানো হয়েছে';['cp-old','cp-new','cp-new2'].forEach(i=>document.getElementById(i).value='')}).catch(x=>{m.className='small bad';m.textContent=typeof x==='string'?x:'পাসওয়ার্ড বদলানো যায়নি'}).finally(()=>el.disabled=false);break}
    case'new-txn':txnSheet(el.dataset.type,el.dataset.party||(view==='party'?arg:null));break;
    case'new-cash':cashSheet(el.dataset.type);break;
    case'new-party':partySheet(el.dataset.type||kTab);break;
    case'edit-party':partySheet(null,party(arg));break;
    case'remind':remindSheet(party(arg));break;
    case'set-due':dueSheet(party(arg));break;
    case'due-q':document.getElementById('d-due').value=addDays(today(),+v);break;
    case'copy-msg':copy(document.getElementById('r-msg').value,'মেসেজ কপি হয়েছে');break;
    case'ktab':kTab=v;render();break;
    case'rr':rr=v;render();break;
    case'day':cashDay=addDays(cashDay,+v);if(cashDay>today())cashDay=today();render();break;
    case'del-txn':case'del-cash':
      if(armed===el.dataset.id){if(a==='del-txn')S.txns=S.txns.filter(t=>t.id!==armed);else S.cash=S.cash.filter(c=>c.id!==armed);armed=null;save();toast('মুছে ফেলা হয়েছে')}
      else armed=el.dataset.id;render();break;
    case'del-party':
      if(armed==='party'){const p=party(arg);S.parties=S.parties.filter(x=>x.id!==arg);S.txns=S.txns.filter(t=>t.partyId!==arg);save();armed=null;toast((p?p.name:'')+' এর খাতা মুছে ফেলা হয়েছে');go('khata')}
      else{armed='party';render()}break;
    case'clear-sample':S={shop:S.shop,sample:false,parties:[],txns:[],cash:[]};save();render();toast('নমুনা মুছে ফেলা হয়েছে, এবার নিজের হিসাব লিখুন');break;
    case'save-shop':{const n=document.getElementById('shopName').value.trim();if(n){S.shop=n;save();render();toast('দোকানের নাম সংরক্ষিত')}break}
    case'copy-bk':copy(JSON.stringify(S),'ব্যাকআপ কপি হয়েছে');break;
    case'restore':{
      const txt=document.getElementById('restore').value.trim();
      try{const d=JSON.parse(txt);if(!Array.isArray(d.parties)||!Array.isArray(d.txns)||!Array.isArray(d.cash))throw 0;S=d;S.sample=false;save();render();toast('ব্যাকআপ ফেরত আনা হয়েছে')}
      catch(x){toast('ব্যাকআপ লেখাটি ঠিক নেই, পুরোটা পেস্ট করেছেন কি না দেখুন')}break}
    case'wipe':
      if(armed==='wipe'){S={shop:S.shop,sample:false,parties:[],txns:[],cash:[]};save();armed=null;toast('সব হিসাব মুছে ফেলা হয়েছে')}else armed='wipe';render();break;
  }
});
function submitSheet(){
  const f=document.getElementById('sf');if(!f||!onSubmit)return;
  const fd=new FormData();
  f.querySelectorAll('input,select,textarea').forEach(el=>{if(!el.name)return;if((el.type==='radio'||el.type==='checkbox')&&!el.checked)return;fd.append(el.name,el.value)});
  let ok=false;try{ok=onSubmit(fd)===true}catch(x){err('কিছু একটা ভুল হয়েছে, আবার চেষ্টা করুন');console.error(x)}
  if(ok){closeSheet();render();if(view==='home')setTimeout(coinSpin,60)}
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-amt'){const o=document.getElementById('calcout'),v=calc(t.value);o.textContent=/[+\-*/×÷x]/.test(en(t.value))&&v>0?'= '+money(v):v>0?money(v):'যোগ-বিয়োগও লিখতে পারেন, যেমন ৫০০+২৫০'}
  if(t.id==='kq'){kq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('kq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ksort'){kSort=t.value;render()}
  if(t.name==='type'||t.id==='f-party'){const f=document.getElementById('sf');const p=party(f.querySelector('[name=party]').value),ty=f.querySelector('[name=type]:checked').value;if(p)document.getElementById('f-cash').checked=(ty==='got')===(p.type==='customer');syncHint()}
  if(t.name==='stype')syncSpay(false);
  if(t.id==='sp-month')syncSpay(true);
  if(t.id==='e-left'){document.getElementById('e-leftbox').hidden=!t.checked}
  if(t.name==='ctype'){document.getElementById('catbox').hidden=t.value!=='expense'}
  if(t.id==='restoreFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('restore').value=r.result;toast('ফাইল পড়া হয়েছে, এবার “ফেরত আনুন” চাপুন')};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(!authEl().hidden&&e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();authGo();return}if(root.hidden)return;if(e.key==='Escape')closeSheet();else if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();submitSheet()}});
addEventListener('hashchange',()=>{if(!USER)return;const h=decodeURIComponent(location.hash.slice(1));if(h&&h!==cur)route(h)});
boot();
})();
</script>
